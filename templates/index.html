<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05080f">
<title>UHQKYRA — Security Scanner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root {
  --bg:      #05080f;
  --bg2:     #0c1120;
  --bg3:     #111827;
  --bg4:     #1a2236;
  --border:  #1e2d45;
  --text:    #e2e8f0;
  --muted:   #64748b;
  --accent:  #00e5ff;
  --accent2: #7c3aed;
  --green:   #00ff88;
  --red:     #ff4757;
  --orange:  #ff9f43;
  --yellow:  #ffd32a;
  --glow:    rgba(0,229,255,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border)}

/* ── PAGE STRUCTURE ── */
.page { display:flex; flex-direction:column; min-height:100vh; }

/* ── HEADER ── */
.header {
  padding: 20px 20px 0;
  text-align: center;
  flex-shrink: 0;
}
.logo {
  font-size: clamp(1.8rem, 8vw, 3rem);
  font-weight: 900;
  letter-spacing: 6px;
  background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  animation: logoPulse 4s ease infinite;
}
@keyframes logoPulse {
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.3)}
}
.logo-sub {
  font-size: 0.65rem;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 2px;
}

/* ── SCAN BOX ── */
.scan-box {
  padding: 20px;
  flex-shrink: 0;
}
.url-wrap {
  display: flex;
  gap: 0;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
  box-shadow: 0 0 0 0 var(--glow);
}
.url-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 20px var(--glow);
}
.url-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 14px 16px;
  font-size: 0.95rem;
  color: var(--text);
  font-family: inherit;
  min-width: 0;
}
.url-input::placeholder { color: var(--muted); font-size: 0.85rem; }
.btn-scan {
  padding: 14px 20px;
  background: linear-gradient(135deg, var(--accent), #0099bb);
  color: #000;
  font-weight: 800;
  font-size: 0.85rem;
  letter-spacing: 1px;
  border: none;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-scan:active { filter: brightness(0.85); transform: scale(0.97); }
.btn-scan.scanning {
  background: linear-gradient(135deg, var(--red), #c0392b);
  color: #fff;
}
.scan-note {
  text-align: center;
  font-size: 0.7rem;
  color: var(--muted);
  margin-top: 8px;
}

/* ── PROGRESS ── */
.progress-section {
  padding: 0 20px 12px;
  display: none;
}
.progress-section.visible { display: block; }
.progress-bar-bg {
  height: 4px;
  background: var(--bg3);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 6px;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 4px;
  transition: width .4s ease;
  width: 0%;
}
.progress-steps {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}
.pstep {
  font-size: 0.6rem;
  color: var(--muted);
  text-align: center;
  flex: 1;
  padding: 0 2px;
  transition: color .3s;
}
.pstep.done { color: var(--green); }
.pstep.active { color: var(--accent); font-weight: 700; }
.progress-label {
  font-size: 0.75rem;
  color: var(--accent);
  text-align: center;
  font-family: monospace;
}

/* ── TABS ── */
.view-tabs {
  display: flex;
  padding: 0 12px;
  gap: 4px;
  flex-shrink: 0;
}
.vtab {
  flex: 1;
  padding: 10px 6px;
  text-align: center;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  user-select: none;
  text-transform: uppercase;
}
.vtab:hover { color: var(--text); }
.vtab.active { color: var(--accent); border-bottom-color: var(--accent); }
.vtab .badge {
  display: inline-block;
  background: var(--red);
  color: #fff;
  font-size: 0.55rem;
  padding: 1px 4px;
  border-radius: 6px;
  margin-left: 3px;
  vertical-align: middle;
}

/* ── CONTENT AREA ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px 90px;
}

/* ── TERMINAL VIEW ── */
.terminal {
  background: var(--bg);
  font-family: 'Fira Code','Cascadia Code','Consolas',monospace;
  font-size: 0.75rem;
  line-height: 1.8;
  min-height: 300px;
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 12px;
  white-space: pre-wrap;
  word-break: break-all;
}
.log-line { display: flex; gap: 8px; }
.log-ts { color: #1e3a5f; font-size: 0.65rem; flex-shrink: 0; padding-top: 3px; min-width: 48px; }
.c-info{color:#4a6080}.c-found{color:var(--green)}.c-warn{color:var(--orange)}
.c-vuln{color:var(--red);font-weight:700}.c-ok{color:#00d4a0}
.c-error{color:#ff6b6b}.c-complete{color:var(--accent);font-weight:700}
.c-section{color:var(--accent2);font-weight:700}
.c-progress{color:#60a5fa}

/* ── RESULTS VIEW ── */
.results-view { display: none; }
.results-view.active { display: block; }

/* RISK BANNER */
.risk-banner {
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.risk-critique { background: rgba(255,71,87,0.12); border: 1px solid rgba(255,71,87,0.4); }
.risk-élevé    { background: rgba(255,159,67,0.12); border: 1px solid rgba(255,159,67,0.4); }
.risk-moyen    { background: rgba(255,211,42,0.12); border: 1px solid rgba(255,211,42,0.4); }
.risk-faible   { background: rgba(0,255,136,0.1);  border: 1px solid rgba(0,255,136,0.3); }
.risk-title { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
.risk-value { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; }
.risk-critique .risk-value { color: var(--red); }
.risk-élevé    .risk-value { color: var(--orange); }
.risk-moyen    .risk-value { color: var(--yellow); }
.risk-faible   .risk-value { color: var(--green); }

/* STATS ROW */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.stat-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
}
.stat-num { font-size: 1.5rem; font-weight: 800; display: block; line-height: 1.1; }
.stat-lbl { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
.sn-red    { color: var(--red); }
.sn-orange { color: var(--orange); }
.sn-yellow { color: var(--yellow); }
.sn-green  { color: var(--green); }
.sn-accent { color: var(--accent); }

/* SECTION CARD */
.section-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
}
.section-header {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  background: var(--bg4);
  transition: background .15s;
}
.section-header:active { background: var(--bg3); }
.section-htitle {
  font-size: 0.82rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-count {
  font-size: 0.65rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 2px 8px;
  color: var(--muted);
}
.section-body {
  padding: 12px 14px;
  display: none;
}
.section-body.open { display: block; }
.chevron { transition: transform .2s; font-size: 0.7rem; color: var(--muted); }
.chevron.open { transform: rotate(180deg); }

/* PORTS TABLE */
.ports-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.ports-table th { padding: 6px 8px; text-align: left; color: var(--muted); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
.ports-table td { padding: 7px 8px; border-bottom: 1px solid rgba(30,45,69,0.6); vertical-align: top; }
.ports-table tr:last-child td { border-bottom: none; }
.port-num { font-weight: 800; font-family: monospace; color: var(--accent); }
.risk-high   { color: var(--red); font-size: 0.65rem; font-weight: 700; }
.risk-medium { color: var(--orange); font-size: 0.65rem; font-weight: 700; }
.risk-low    { color: var(--green); font-size: 0.65rem; font-weight: 700; }

/* VULN LIST */
.vuln-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px solid rgba(30,45,69,0.6);
  font-size: 0.8rem;
}
.vuln-item:last-child { border-bottom: none; }
.vsev {
  font-size: 0.6rem;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
  flex-shrink: 0;
  margin-top: 2px;
  letter-spacing: 0.5px;
}
.vsev-critical { background: rgba(255,71,87,0.2); color: var(--red); border: 1px solid rgba(255,71,87,0.4); }
.vsev-high     { background: rgba(255,159,67,0.2); color: var(--orange); border: 1px solid rgba(255,159,67,0.4); }
.vsev-medium   { background: rgba(255,211,42,0.2); color: var(--yellow); border: 1px solid rgba(255,211,42,0.4); }
.vsev-low      { background: rgba(0,255,136,0.12); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
.vuln-name { flex: 1; line-height: 1.4; }
.vuln-detail { font-size: 0.68rem; color: var(--muted); margin-top: 2px; font-family: monospace; }

/* DIR / TECH / DNS items */
.list-item {
  padding: 6px 0;
  border-bottom: 1px solid rgba(30,45,69,0.4);
  font-size: 0.78rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.list-item:last-child { border-bottom: none; }
.item-url { font-family: monospace; color: var(--accent); flex: 1; word-break: break-all; font-size: 0.72rem; }
.item-status { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
.s200 { background: rgba(0,255,136,0.15); color: var(--green); }
.s403 { background: rgba(255,159,67,0.15); color: var(--orange); }
.s401 { background: rgba(255,71,87,0.15); color: var(--red); }
.s301,.s302 { background: rgba(96,165,250,0.15); color: #60a5fa; }

/* DNS table */
.dns-row { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(30,45,69,0.4); font-size: 0.75rem; }
.dns-row:last-child { border-bottom: none; }
.dns-type { font-weight: 700; color: var(--accent2); min-width: 50px; font-size: 0.68rem; font-family: monospace; }
.dns-val { flex: 1; word-break: break-all; color: var(--text); }

/* DB CARD */
.db-card {
  background: rgba(255,71,87,0.06);
  border: 1.5px solid rgba(255,71,87,0.4);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.db-title { font-size: 0.85rem; font-weight: 800; color: var(--red); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.db-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.db-field { background: var(--bg2); border-radius: 8px; padding: 8px 10px; }
.db-field-label { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
.db-field-value { font-size: 0.82rem; font-weight: 700; color: var(--text); font-family: monospace; word-break: break-all; }
.db-tables { display: flex; flex-wrap: wrap; gap: 6px; }
.db-table-tag {
  background: rgba(255,71,87,0.1);
  border: 1px solid rgba(255,71,87,0.3);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 0.72rem;
  font-family: monospace;
  color: var(--red);
}
.db-table-tag.sensitive {
  background: rgba(255,71,87,0.25);
  border-color: var(--red);
  font-weight: 700;
}

/* DOWNLOAD BUTTONS */
.download-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 10px 14px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: none;
  gap: 8px;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.download-bar.visible { display: flex; }
.btn-dl {
  flex: 1;
  padding: 12px 10px;
  border-radius: 10px;
  border: none;
  font-weight: 800;
  font-size: 0.8rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all .15s;
  letter-spacing: 0.5px;
}
.btn-dl:active { transform: scale(0.96); }
.btn-dl-txt { background: linear-gradient(135deg,var(--accent),#0099bb); color: #000; }
.btn-dl-db  { background: linear-gradient(135deg,var(--red),#c0392b); color: #fff; }
.btn-dl-db.hidden { display: none; }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 0.85rem; line-height: 1.6; }

/* ANIMATIONS */
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.fade-up { animation: fadeUp .25s ease; }
@keyframes spin { to{transform:rotate(360deg)} }
.spin { animation: spin 1s linear infinite; display: inline-block; }

/* TAG */
.tag { display:inline-block; padding:2px 7px; border-radius:4px; font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.tag-tech { background: rgba(124,58,237,0.15); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }

/* Scrollbar */
.content::-webkit-scrollbar { width: 3px; }
.content::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">UHQKYRA</div>
    <div class="logo-sub">Security Scanner · v2.0</div>
  </div>

  <!-- SCAN BOX -->
  <div class="scan-box">
    <div class="url-wrap">
      <input id="url-input" class="url-input" type="url"
        placeholder="https://example.com ou domain.com"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button id="btn-scan" class="btn-scan" onclick="toggleScan()">
        <span id="scan-icon">⚡</span>
        <span id="scan-label">SCANNER</span>
      </button>
    </div>
    <div class="scan-note">⚠️ Utilise uniquement sur des cibles autorisées</div>
  </div>

  <!-- PROGRESS -->
  <div id="progress-section" class="progress-section">
    <div class="progress-steps" id="progress-steps">
      <div class="pstep" id="ps-whois">WHOIS</div>
      <div class="pstep" id="ps-dns">DNS</div>
      <div class="pstep" id="ps-ports">PORTS</div>
      <div class="pstep" id="ps-http">HTTP</div>
      <div class="pstep" id="ps-ssl">SSL</div>
      <div class="pstep" id="ps-dirs">DIRS</div>
      <div class="pstep" id="ps-vulns">VULNS</div>
      <div class="pstep" id="ps-done">DONE</div>
    </div>
    <div class="progress-bar-bg">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>
    <div id="progress-label" class="progress-label">Initialisation...</div>
  </div>

  <!-- TABS -->
  <div class="view-tabs">
    <div class="vtab active" id="tab-results" onclick="showTab('results')">
      Résultats <span id="badge-vulns" class="badge" style="display:none">0</span>
    </div>
    <div class="vtab" id="tab-terminal" onclick="showTab('terminal')">Terminal</div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">

    <!-- RESULTS VIEW -->
    <div id="view-results" class="results-view active">
      <div class="empty-state" id="empty-state">
        <div class="icon">⚡</div>
        <p>Entre une URL ci-dessus<br>et lance le scan complet.<br><br>
        <span style="font-size:0.75rem;color:var(--muted)">Ports · DNS · HTTP · SSL · Dirs · Vulnérabilités</span></p>
      </div>

      <!-- Populated by JS -->
      <div id="results-content" style="display:none"></div>
    </div>

    <!-- TERMINAL VIEW -->
    <div id="view-terminal" style="display:none">
      <div id="terminal" class="terminal"></div>
    </div>

  </div>

  <!-- DOWNLOAD BAR -->
  <div id="download-bar" class="download-bar">
    <button class="btn-dl btn-dl-txt" id="btn-dl-txt" onclick="downloadTxt()">
      ⬇️ Télécharger .TXT
    </button>
    <button class="btn-dl btn-dl-db hidden" id="btn-dl-db" onclick="downloadDb()">
      🗄️ Télécharger DB
    </button>
  </div>

</div><!-- .page -->

<script>
// ─── STATE ───────────────────────────────────────────────────
let scanning = false;
let curScanId = null;
let curSrc = null;
let scanResults = null;
const STEP_LABELS = ['ps-whois','ps-dns','ps-ports','ps-http','ps-ssl','ps-dirs','ps-vulns','ps-done'];

// ─── TABS ─────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.vtab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('view-results').style.display = name==='results'?'block':'none';
  document.getElementById('view-terminal').style.display = name==='terminal'?'block':'none';
  if(name==='terminal') scrollTerminal();
}

// ─── TERMINAL ────────────────────────────────────────────────
function log(msg, type='info') {
  const term = document.getElementById('terminal');
  const line = document.createElement('div');
  line.className = 'log-line';
  const ts = new Date().toLocaleTimeString('fr',{hour12:false});
  line.innerHTML = `<span class="log-ts">${ts}</span><span class="c-${type}">${esc(msg)}</span>`;
  term.appendChild(line);
  scrollTerminal();
}
function scrollTerminal() {
  const t = document.getElementById('terminal');
  t.scrollTop = t.scrollHeight;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ─── PROGRESS ────────────────────────────────────────────────
function setProgress(step, total, label) {
  const pct = Math.round((step/total)*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-label').textContent = label || '';

  STEP_LABELS.forEach((id, i) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(i < step) el.className = 'pstep done';
    else if(i === step-1) el.className = 'pstep active';
    else el.className = 'pstep';
  });
}

// ─── SCAN ─────────────────────────────────────────────────────
function toggleScan() {
  if(scanning) { stopScan(); return; }
  startScan();
}

function startScan() {
  const url = document.getElementById('url-input').value.trim();
  if(!url) {
    document.getElementById('url-input').focus();
    return;
  }

  scanning = true;
  scanResults = null;
  document.getElementById('terminal').innerHTML = '';
  document.getElementById('results-content').style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('download-bar').classList.remove('visible');
  document.getElementById('badge-vulns').style.display = 'none';

  // UI scan mode
  const btn = document.getElementById('btn-scan');
  btn.className = 'btn-scan scanning';
  document.getElementById('scan-icon').className = 'spin';
  document.getElementById('scan-icon').textContent = '⟳';
  document.getElementById('scan-label').textContent = 'STOP';

  document.getElementById('progress-section').classList.add('visible');
  setProgress(0, 8, 'Connexion...');

  fetch('/api/fullscan', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({url})
  })
  .then(r=>r.json())
  .then(data => {
    if(data.error) { log('❌ '+data.error,'error'); stopScan(); return; }
    curScanId = data.scan_id;
    const src = new EventSource('/api/stream/'+data.scan_id);
    curSrc = src;

    src.onmessage = e => {
      const evt = JSON.parse(e.data);

      // Routing messages
      if(evt.type === 'progress') {
        if(evt.step !== undefined) setProgress(evt.step, evt.total||8, evt.label||'');
        return;
      }
      if(evt.type === 'section') {
        log(evt.message, 'section');
        return;
      }
      if(evt.type === 'done_full') {
        // Scan complete — load results
        fetch('/api/fullscan/results/'+curScanId)
          .then(r=>r.json())
          .then(res => {
            scanResults = res;
            renderResults(res);
            stopScan(true);
          });
        return;
      }
      if(evt.type === 'done' || evt.type === 'keepalive') return;

      if(evt.message) log(evt.message, evt.type||'info');
    };

    src.onerror = () => { src.close(); if(scanning) { log('⚠️ Stream interrompu','warn'); stopScan(); } };
  })
  .catch(e => { log('❌ Erreur: '+e,'error'); stopScan(); });
}

function stopScan(completed=false) {
  if(curSrc) { curSrc.close(); curSrc=null; }
  scanning = false;

  const btn = document.getElementById('btn-scan');
  btn.className = 'btn-scan';
  document.getElementById('scan-icon').className = '';
  document.getElementById('scan-icon').textContent = '⚡';
  document.getElementById('scan-label').textContent = 'SCANNER';

  if(!completed) {
    document.getElementById('progress-section').classList.remove('visible');
  } else {
    setProgress(8, 8, '✅ Scan terminé !');
  }
}

// ─── RENDER RESULTS ──────────────────────────────────────────
function renderResults(res) {
  const container = document.getElementById('results-content');
  const s = res.summary || {};
  container.innerHTML = '';
  container.style.display = 'block';
  document.getElementById('empty-state').style.display = 'none';

  // Risk banner
  const risk = (s.overall_risk || 'FAIBLE').toLowerCase();
  container.innerHTML += `
    <div class="risk-banner risk-${risk} fade-up">
      <div>
        <div class="risk-title">Niveau de risque global</div>
        <div class="risk-value">${s.overall_risk||'?'}</div>
        <div style="font-size:0.7rem;color:var(--muted);margin-top:4px">Score: ${s.risk_score||0} | ${res.domain} (${res.ip})</div>
      </div>
      <div style="font-size:2.5rem">
        ${ risk==='critique'?'🚨' : risk==='élevé'?'⚠️' : risk==='moyen'?'⚡':'✅' }
      </div>
    </div>`;

  // Stats
  container.innerHTML += `
    <div class="stats-row fade-up">
      <div class="stat-card"><span class="stat-num sn-red">${s.vulns_critical||0}</span><div class="stat-lbl">Critical</div></div>
      <div class="stat-card"><span class="stat-num sn-orange">${s.vulns_high||0}</span><div class="stat-lbl">High</div></div>
      <div class="stat-card"><span class="stat-num sn-accent">${s.open_ports||0}</span><div class="stat-lbl">Ports</div></div>
      <div class="stat-card"><span class="stat-num sn-green">${s.dirs_found||0}</span><div class="stat-lbl">Dirs</div></div>
    </div>`;

  // DATABASE (priorité si trouvée)
  if(res.database && res.database.version) {
    const db = res.database;
    const tables = db.tables || [];
    const sensitiveWords = ['user','admin','password','account','credential','secret','token','auth'];
    container.innerHTML += `
      <div class="db-card fade-up">
        <div class="db-title">🚨 BASE DE DONNÉES EXTRAITE</div>
        <div class="db-info">
          <div class="db-field"><div class="db-field-label">Type</div><div class="db-field-value">${db.db_type||'?'}</div></div>
          <div class="db-field"><div class="db-field-label">Version</div><div class="db-field-value">${(db.version||'?').slice(0,30)}</div></div>
          <div class="db-field"><div class="db-field-label">Utilisateur</div><div class="db-field-value">${db.current_user||'?'}</div></div>
          <div class="db-field"><div class="db-field-label">Base active</div><div class="db-field-value">${db.current_db||'?'}</div></div>
        </div>
        ${tables.length ? `<div style="font-size:0.7rem;color:var(--muted);margin-bottom:8px">Tables trouvées :</div>
          <div class="db-tables">
            ${tables.map(t=>{
              const sens = sensitiveWords.some(w=>t.toLowerCase().includes(w));
              return `<div class="db-table-tag ${sens?'sensitive':''}">${t}${sens?' 🔑':''}</div>`;
            }).join('')}
          </div>` : ''}
      </div>`;
    document.getElementById('btn-dl-db').classList.remove('hidden');
  }

  // VULNERABILITIES
  const vulns = res.vulnerabilities || [];
  if(vulns.length) {
    const sev_order = {critical:0,high:1,medium:2,low:3};
    const sorted = [...vulns].sort((a,b)=>(sev_order[a.severity]||4)-(sev_order[b.severity]||4));
    let vulnHTML = sorted.map(v=>`
      <div class="vuln-item">
        <div class="vsev vsev-${v.severity||'low'}">${v.severity||'?'}</div>
        <div>
          <div class="vuln-name">${esc(v.name||'')}</div>
          ${v.detail?`<div class="vuln-detail">${esc(v.detail.slice(0,100))}</div>`:''}
        </div>
      </div>`).join('');

    container.innerHTML += buildSection('💥', `Vulnérabilités`, vulns.length, vulnHTML, true);

    // Badge
    const badge = document.getElementById('badge-vulns');
    badge.textContent = vulns.length;
    badge.style.display = 'inline-block';
  }

  // OPEN PORTS
  const ports = (res.ports||[]).filter(p=>p.state==='open');
  if(ports.length) {
    let html = `<table class="ports-table">
      <tr><th>Port</th><th>Service</th><th>Risque</th><th>Banner</th></tr>
      ${ports.map(p=>`<tr>
        <td class="port-num">${p.port}</td>
        <td>${p.service||'?'}</td>
        <td class="risk-${p.risk||'low'}">${(p.risk||'').toUpperCase()}</td>
        <td style="font-size:0.68rem;color:var(--muted);max-width:120px;overflow:hidden">${esc((p.banner||'').slice(0,60))}</td>
      </tr>`).join('')}
    </table>`;
    container.innerHTML += buildSection('🔍', 'Ports ouverts', ports.length, html);
  }

  // TECHNOLOGIES
  const techs = res.technologies || [];
  if(techs.length) {
    let html = `<div style="display:flex;flex-wrap:wrap;gap:7px">
      ${techs.map(t=>`<span class="tag tag-tech">🔧 ${esc(t.name)} <span style="opacity:0.6">(${t.category})</span></span>`).join('')}
    </div>`;
    container.innerHTML += buildSection('🔧', 'Technologies détectées', techs.length, html);
  }

  // DIRECTORIES
  const dirs200 = (res.directories||[]).filter(d=>d.status===200);
  const dirs403 = (res.directories||[]).filter(d=>[401,403].includes(d.status));
  if(dirs200.length || dirs403.length) {
    let html = dirs200.map(d=>`
      <div class="list-item">
        <div class="item-url">/${d.path}</div>
        <div class="item-status s200">200</div>
        <div style="font-size:0.65rem;color:var(--muted)">${d.size||0}B</div>
      </div>`).join('') +
      dirs403.map(d=>`
      <div class="list-item">
        <div class="item-url">/${d.path}</div>
        <div class="item-status s${d.status}">${d.status}</div>
      </div>`).join('');
    container.innerHTML += buildSection('📂', 'Répertoires trouvés', dirs200.length+dirs403.length, html);
  }

  // DNS
  const dns = res.dns || {};
  const dnsEntries = Object.entries(dns).filter(([,v])=>v&&v.length);
  if(dnsEntries.length) {
    let html = dnsEntries.map(([type, records])=>{
      const recs = Array.isArray(records) ? records : [records];
      return recs.map(r=>`
        <div class="dns-row">
          <div class="dns-type">${type}</div>
          <div class="dns-val">${esc(typeof r==='object'?JSON.stringify(r):String(r))}</div>
        </div>`).join('');
    }).join('');
    container.innerHTML += buildSection('🌐', 'Enregistrements DNS', dnsEntries.length, html);
  }

  // WHOIS
  const whois = res.whois || {};
  const wEntries = Object.entries(whois).filter(([,v])=>v);
  if(wEntries.length) {
    let html = wEntries.map(([k,v])=>`
      <div class="list-item">
        <div style="font-size:0.68rem;color:var(--muted);min-width:100px">${k.replace(/_/g,' ')}</div>
        <div style="font-size:0.75rem;flex:1;word-break:break-all">${esc(String(v).slice(0,100))}</div>
      </div>`).join('');
    container.innerHTML += buildSection('📋', 'WHOIS', wEntries.length, html);
  }

  // Show download bar
  document.getElementById('download-bar').classList.add('visible');

  // Switch to results tab
  showTab('results');

  // Expand vulns by default
  const firstBody = container.querySelector('.section-body');
  if(firstBody) { firstBody.classList.add('open'); const ch=firstBody.previousElementSibling?.querySelector('.chevron'); if(ch)ch.classList.add('open'); }
}

function buildSection(icon, title, count, bodyHTML, defaultOpen=false) {
  const id = 'sec_'+Math.random().toString(36).slice(2);
  return `
    <div class="section-card fade-up">
      <div class="section-header" onclick="toggleSection('${id}')">
        <div class="section-htitle">${icon} ${title}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="section-count">${count}</span>
          <span class="chevron ${defaultOpen?'open':''}">▼</span>
        </div>
      </div>
      <div class="section-body ${defaultOpen?'open':''}" id="${id}">${bodyHTML}</div>
    </div>`;
}

function toggleSection(id) {
  const body = document.getElementById(id);
  const chevron = body.previousElementSibling.querySelector('.chevron');
  body.classList.toggle('open');
  chevron.classList.toggle('open');
}

// ─── DOWNLOADS ───────────────────────────────────────────────
function downloadTxt() {
  if(!curScanId) return;
  window.open('/api/download/txt/'+curScanId, '_blank');
}
function downloadDb() {
  if(!curScanId) return;
  window.open('/api/download/db/'+curScanId, '_blank');
}

// ─── KEYBOARD ────────────────────────────────────────────────
document.getElementById('url-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') toggleScan();
});
</script>
</body>
</html>
